services:
  - type: web
    name: linkedin-profile-api
    runtime: docker
    plan: 1c-2g
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_KEYS
        generateValue: true
      - key: AUTHENTICATED_MODE_ENABLED
        value: "false"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: SCRAPE_CONCURRENCY
        value: "2"
      - key: SCRAPE_QUEUE_MAX
        value: "20"
      - key: CACHE_TTL_SECONDS
        value: "3600"
      - key: CACHE_MAX_VALUE_BYTES
        value: "524288"
      - key: BROWSER_HEADLESS
        value: "true"
